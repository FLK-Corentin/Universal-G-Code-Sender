name: Build UGS Platform Windows

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Build UGS
        run: |
          ./mvnw clean install -DskipTests

      - name: Package UGS Platform Windows x64
        run: |
          ./mvnw package \
            -pl ugs-platform/application \
            -P create-win64-package \
            -DskipTests=true

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: UGS-Platform-Windows-x64
          path: ugs-platform/application/target/win64-ugs-platform-app-*.zip
          
msi:
    needs: build
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download portable UGS
        uses: actions/download-artifact@v4
        with:
          name: UGS-Platform-Windows-x64
          path: portable

      - name: Extract portable UGS
        shell: pwsh
        run: |
          $zip = Get-ChildItem "${{github.workspace}}\portable" `
            -Filter "win64-ugs-platform-app-*.zip" |
            Select-Object -First 1

          if (-not $zip) {
              throw "Archive UGS Windows introuvable."
          }

          New-Item -ItemType Directory `
            -Force `
            -Path "${{github.workspace}}\msi-src"

          Expand-Archive `
            -Path $zip.FullName `
            -DestinationPath "${{github.workspace}}\msi-src"

          $appRoot = Get-ChildItem "${{github.workspace}}\msi-src" `
            -Directory |
            Select-Object -First 1

          "APP_SOURCE=$($appRoot.FullName)" >> $env:GITHUB_ENV

      - name: Install WiX Toolset
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2

      - name: Build MSI
        shell: pwsh
        run: |
          New-Item -ItemType Directory `
            -Force `
            -Path "${{github.workspace}}\dist"

          wix build "${{github.workspace}}\installer\Package.wxs" `
            -arch x64 `
            -d "AppSource=$env:APP_SOURCE" `
            -d "IconSource=${{github.workspace}}\ugs-platform\application\src\main\app-resources\icon.ico" `
            -o "${{github.workspace}}\dist\UGS-Fablab-en-Kit-1.0.0-x64.msi"

      - name: Upload MSI
        uses: actions/upload-artifact@v4
        with:
          name: UGS-Fablab-en-Kit-MSI
          path: ${{github.workspace}}\dist\UGS-Fablab-en-Kit-1.0.0-x64.msi
