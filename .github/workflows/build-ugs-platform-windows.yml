name: Build UGS Platform Windows

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build UGS
        run: |
          mvn clean install -DskipTests

      - name: Package UGS Platform Windows x64
        run: |
          mvn package \
            -pl ugs-platform/application \
            -P create-win64-package \
            -DskipTests=true

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: UGS-Platform-Windows-x64
          path: ugs-platform/application/target/win64-ugs-platform-app-*.zip
